apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-awc.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Grpc.Net.Client.Balancer": "Debug",
          "Tgs.GameRecord.Awc.Messages.ManualMessageHandler": "Information",
          "Tgs.GameRecord.Awc.Messages.ScheduleMessageHandler": "Warning",
          "Tgs.GameRecord.Awc.Core.ApplicationServices.HandleRecordCommandService": "Warning"
        }
      },
      "GameRecordInfo": {
        "GameProviderCode": "AWC",
        "GameProviderCodes": [
          "AWC_COCKFIGHT",
          "AWC_FS",
          "AWC_KM",
          "AWC_LUDO",
          "AWC_PGS",
          "AWC_RCB",
          "AWC_SG",
          "AWC_SPADE",
          "AWC_YL",
          "AWC_YESBINGO",
          "AWC_BG"
        ],
        "HangfirePrefix": "gamerecord-awc-hangfire:",
        "HangfireLocking": "gamerecord-awc-locking:",
        "IntervalMinutes": 5,
        "IntervalMinutesMax": 60,
        "IntervalMinutesMinimum": 1
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "http://game-gameinterface-awc:9090/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]