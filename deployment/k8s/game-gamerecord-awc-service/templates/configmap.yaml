apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-awc-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "game-gamerecord-awc-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "AWC",
        "IntervalMinute": 3
      },
      "GameRecord": {
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
        "GameProvidersBaseUrl": "http://game-gameproviders/",
        "GameInterfaceAwcServiceBaseUrl": "http://game-gameinterface-awc-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
